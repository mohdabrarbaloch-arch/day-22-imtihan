services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imtihan
      POSTGRES_PASSWORD: imtihan
      POSTGRES_DB: imtihan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imtihan"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://imtihan:imtihan@db:5432/imtihan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ALLOWED_ORIGINS: "*"
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
